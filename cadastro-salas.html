<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTech - Cadastro de Salas</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a href="./index.html" class="navbar-brand">
                <img src="./img/school.svg" alt="Logo CineTech" width="30" height="24" class="d-inline-block align-text-top">
                CineTech
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="./cadastro-filmes.html" class="nav-link">Filmes</a>
                    </li>
                    <li class="nav-item">
                        <a href="./cadastro-salas.html" class="nav-link active">Salas</a>
                    </li>
                    <li class="nav-item">
                        <a href="./cadastro-sessoes.html" class="nav-link">Sessões</a>
                    </li>
                    <li class="nav-item">
                        <a href="./venda-ingressos.html" class="nav-link">Ingressos</a>
                    </li>
                    <li class="nav-item">
                        <a href="./sessoes.html" class="nav-link">Sessões Disponíveis</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4">Cadastro de Salas</h2>
        <hr>

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form id="formSala">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="nomeSala" class="form-label">Nome da Sala</label>
                            <input type="text" class="form-control" id="nomeSala" required>
                        </div>

                        <div class="col-md-4">
                            <label for="capacidade" class="form-label">Capacidade</label>
                            <input type="number" class="form-control" id="capacidade" required>
                        </div>

                        <div class="col-md-4">
                            <label for="tipoSala" class="form-label">Tipo</label>
                            <select class="form-select" id="tipoSala" required>
                                <option value="">Selecione</option>
                                <option value="2D">2D</option>
                                <option value="3D">3D</option>
                                <option value="IMAX">IMAX</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-dark">Salvar Sala</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <h3 class="mb-3">Salas Cadastradas</h3>
        <div class="row g-4" id="listaSalas"></div>
    </main>

    

    <script src="./js/cadastro-salas.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
