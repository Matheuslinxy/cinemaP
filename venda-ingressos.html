<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTech - Venda de Ingressos</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a href="./index.html" class="navbar-brand">
                <img src="./img/school.svg" alt="Logo CineTech" width="30" height="24" class="d-inline-block align-text-top">
                CineTech
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="./cadastro-filmes.html" class="nav-link">Filmes</a>
                    </li>
                    <li class="nav-item">
                        <a href="./cadastro-salas.html" class="nav-link">Salas</a>
                    </li>
                    <li class="nav-item">
                        <a href="./cadastro-sessoes.html" class="nav-link">Sessões</a>
                    </li>
                    <li class="nav-item">
                        <a href="./venda-ingressos.html" class="nav-link active">Ingressos</a>
                    </li>
                    <li class="nav-item">
                        <a href="./sessoes.html" class="nav-link">Sessões Disponíveis</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4">Venda de Ingressos</h2>
        <hr>

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form id="formIngresso">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="sessao" class="form-label">Sessão</label>
                            <select class="form-select" id="sessao" required>
                                <option value="">Selecione uma sessão</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="cliente" class="form-label">Nome do Cliente</label>
                            <input type="text" class="form-control" id="cliente" required>
                        </div>

                        <div class="col-md-4">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpf" required>
                        </div>

                        <div class="col-md-4">
                            <label for="assento" class="form-label">Assento</label>
                            <input type="text" class="form-control" id="assento" placeholder="Ex: A10" required>
                        </div>

                        <div class="col-md-4">
                            <label for="pagamento" class="form-label">Tipo de Pagamento</label>
                            <select class="form-select" id="pagamento" required>
                                <option value="">Selecione</option>
                                <option value="Cartão">Cartão</option>
                                <option value="Pix">Pix</option>
                                <option value="Dinheiro">Dinheiro</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-dark">Confirmar Venda</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <h3 class="mb-3">Ingressos Vendidos</h3>
        <div class="row g-4" id="listaIngressos"></div>
    </main>

    <script src="./js/venda-ingressos.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
