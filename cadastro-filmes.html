<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTech - Cadastro de Filmes</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">

            <a href="./index.html" class="navbar-brand">
                <img src="./img/school.svg" alt="Logo CineTech" width="30" height="24" class="d-inline-block align-text-top">
                CineTech
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="./cadastro-filmes.html" class="nav-link active">Filmes</a>
                    </li>
                    <li class="nav-item">
                        <a href="./cadastro-salas.html" class="nav-link">Salas</a>
                    </li>
                    <li class="nav-item">
                        <a href="./cadastro-sessoes.html" class="nav-link">Sessões</a>
                    </li>
                    <li class="nav-item">
                        <a href="./venda-ingressos.html" class="nav-link">Ingressos</a>
                    </li>
                    <li class="nav-item">
                        <a href="./sessoes.html" class="nav-link">Sessões Disponíveis</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4">Cadastro de Filmes</h2>
        <hr>

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form id="formFilme">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required>
                        </div>

                        <div class="col-md-6">
                            <label for="genero" class="form-label">Gênero</label>
                            <input type="text" class="form-control" id="genero" required>
                        </div>

                        <div class="col-12">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" rows="3" required></textarea>
                        </div>

                        <div class="col-md-4">
                            <label for="classificacao" class="form-label">Classificação Indicativa</label>
                            <select class="form-select" id="classificacao" required>
                                <option value="">Selecione</option>
                                <option value="Livre">Livre</option>
                                <option value="10 anos">10 anos</option>
                                <option value="12 anos">12 anos</option>
                                <option value="14 anos">14 anos</option>
                                <option value="16 anos">16 anos</option>
                                <option value="18 anos">18 anos</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="duracao" class="form-label">Duração (minutos)</label>
                            <input type="number" class="form-control" id="duracao" required>
                        </div>

                        <div class="col-md-4">
                            <label for="estreia" class="form-label">Data de Estreia</label>
                            <input type="date" class="form-control" id="estreia" required>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-dark">Salvar Filme</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <h3 class="mb-3">Filmes Cadastrados</h3>
        <div class="row g-4" id="listaFilmes"></div>
    </main>


    <script src="./js/cadastro-filmes.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
